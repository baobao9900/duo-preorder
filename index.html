<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>iPhone Duo 预订</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;background:#fff;color:#1d1d1f;-webkit-font-smoothing:antialiased}
.nav{position:sticky;top:0;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #e5e5e7;padding:12px 20px;font-size:14px;display:flex;justify-content:space-between;z-index:5}
.wrap{max-width:560px;margin:0 auto;padding:24px 20px 40px}
.new{color:#bf4800;font-size:13px}h1{font-size:34px;font-weight:700;margin:4px 0 6px}.sub{color:#6e6e73;font-size:15px}
.hero{background:#f5f5f7;border-radius:24px;margin:22px 0;padding:30px 0;display:flex;justify-content:center}
.phone{width:150px;height:300px;border-radius:34px;position:relative;transition:background .4s;box-shadow:0 20px 40px rgba(0,0,0,.18),inset 0 0 0 3px rgba(255,255,255,.35)}
.cam{position:absolute;top:18px;left:18px;width:62px;height:62px;border-radius:18px;background:rgba(0,0,0,.18)}
.cam i{position:absolute;width:22px;height:22px;border-radius:50%;background:#222;box-shadow:inset 0 0 0 3px #555}.cam i:nth-child(1){top:7px;left:7px}.cam i:nth-child(2){bottom:7px;right:7px}
.white{background:linear-gradient(145deg,#fbfaf6,#e6e2d8)}.dark{background:linear-gradient(145deg,#3a4150,#1a1e27)}
h2{font-size:20px;margin:26px 0 12px}.opts{display:grid;gap:10px}.opt{border:1.5px solid #d2d2d7;border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center;font-size:16px;background:#fff;cursor:pointer}
.opt.on{border-color:#0071e3;box-shadow:0 0 0 1px #0071e3}.dot{width:22px;height:22px;border-radius:50%;margin-right:10px;border:1px solid #bbb;display:inline-block;vertical-align:middle}
.price{color:#6e6e73;font-size:14px}input{width:100%;font-size:16px;padding:14px;border:1px solid #d2d2d7;border-radius:12px;margin-bottom:10px}
.sum{background:#f5f5f7;border-radius:18px;padding:18px;margin-top:24px;font-size:15px;line-height:1.8}.total{font-size:22px;font-weight:700}
.btn{display:block;width:100%;background:#0071e3;color:#fff;border:0;border-radius:14px;padding:16px;font-size:17px;margin-top:16px;cursor:pointer}
footer{text-align:center;color:#86868b;font-size:12px;padding:20px}
#ok{display:none;animation:up .6s ease}@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1}}
.check{width:80px;height:80px;border-radius:50%;background:#34c759;color:#fff;font-size:44px;display:flex;align-items:center;justify-content:center;margin:20px auto;animation:pop .5s ease}@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.15)}}
.c{text-align:center}.ship{color:#bf4800;font-size:20px;font-weight:700;margin:10px 0}
.track{display:flex;justify-content:space-between;margin:26px 0;position:relative}.track:before{content:"";position:absolute;top:11px;left:10%;right:10%;height:3px;background:#d2d2d7}
.st{flex:1;text-align:center;font-size:12px;position:relative}.st b{display:block;width:24px;height:24px;border-radius:50%;background:#d2d2d7;margin:0 auto 6px}.st.d b{background:#0071e3}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}
</style></head><body>
<div class="nav"><span>iPhone Duo</span><span>预订</span></div>
<div class="wrap" id="buy">
<div class="new">新品</div><h1>购买 iPhone Duo</h1><div class="sub">RMB 15999 起</div>
<div class="hero"><div class="phone white" id="ph"><div class="cam"><i></i><i></i></div></div></div>
<h2>外观。<span class="price">选择你喜欢的颜色。</span></h2><div class="opts" id="colors"></div>
<h2>存储容量。<span class="price">需要多少空间？</span></h2><div class="opts" id="caps"></div>
<h2>数量</h2><div class="opt on">1 台</div>
<h2>取货方式</h2><div class="opt on" style="display:block">取货方式：自取 · Apple 浦东<div class="price">上海市浦东新区陆家嘴世纪大道 8 号国金中心商场</div></div>
<div class="sum" id="sum"></div><button class="btn" id="go">立即预订</button></div>
<div class="wrap c" id="ok"><div class="check">✓</div><h1>订单已提交</h1><div class="sub">订单号 <span id="no"></span></div>
<div class="ship">预计可取货：10月23日</div><div class="sum" id="rc" style="text-align:left"></div>
<div class="track"><div class="st d"><b></b>已下单</div><div class="st d"><b></b>备货中</div><div class="st"><b></b>10月23日可取货</div><div class="st"><b></b>已取货</div></div>
<canvas id="qrc" width="210" height="210" style="position:static;display:block;margin:10px auto;border-radius:12px"></canvas><div class="sub">凭此码到店取货 (娱乐)</div>
<button class="btn" onclick="location.reload()">返回</button></div>
<footer>娱乐页面，非 Apple 官方，不产生任何订单</footer><canvas id="cf"></canvas>
<script>
const C=[["星光白色","#f3efe6","white"],["夜空色","#2b313d","dark"]],S=[["256GB",15999],["512GB",17999],["1TB",20999],["2TB",24999]];
let c=0,s=0;const $=i=>document.getElementById(i),f=n=>"RMB "+n.toLocaleString();
function r(){colors.innerHTML=C.map((x,i)=>`<div class="opt ${i==c?'on':''}" data-c="${i}"><span><span class="dot" style="background:${x[1]}"></span>${x[0]}</span></div>`).join("");
caps.innerHTML=S.map((x,i)=>`<div class="opt ${i==s?'on':''}" data-s="${i}"><span>${x[0]}</span><span class="price">${f(x[1])}</span></div>`).join("");
ph.className="phone "+C[c][2];sum.innerHTML=`iPhone Duo ${S[s][0]} ${C[c][0]} × 1<br>自取 · Apple 浦东 · 预计可取货：10月23日<br><span class="total">${f(S[s][1])}</span>`}
document.onclick=e=>{const o=e.target.closest("[data-c],[data-s]");if(!o)return;if(o.dataset.c)c=+o.dataset.c;if(o.dataset.s)s=+o.dataset.s;r()};r();
go.onclick=()=>{no.textContent="W"+Math.floor(1e9+Math.random()*9e9);
rc.innerHTML=`商品：iPhone Duo<br>颜色：${C[c][0]}<br>容量：${S[s][0]}<br>数量：1<br>金额：<b>${f(S[s][1])}</b>`+`<br>取货门店：Apple 浦东<br>预计可取货：10月23日`;qr(no.textContent);
buy.style.display="none";ok.style.display="block";scrollTo(0,0);boom()};
function qr(t){const x=qrc.getContext("2d"),n=25,z=8,o=5;let h=0;for(const ch of t)h=(h*31+ch.charCodeAt(0))>>>0;const rnd=()=>(h=(h*1103515245+12345)>>>0)/4294967296;
x.fillStyle="#fff";x.fillRect(0,0,210,210);x.fillStyle="#1d1d1f";const f=(a,b)=>a<7&&b<7||a>=n-7&&b<7||a<7&&b>=n-7;
for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(!f(i,j)&&rnd()<.5)x.fillRect(o+i*z,o+j*z,z,z);
[[0,0],[n-7,0],[0,n-7]].forEach(([a,b])=>{x.fillRect(o+a*z,o+b*z,7*z,7*z);x.fillStyle="#fff";x.fillRect(o+(a+1)*z,o+(b+1)*z,5*z,5*z);x.fillStyle="#1d1d1f";x.fillRect(o+(a+2)*z,o+(b+2)*z,3*z,3*z)})}
function boom(){const k=cf,x=k.getContext("2d");k.width=innerWidth;k.height=innerHeight;let p=[...Array(160)].map(()=>({x:k.width/2,y:k.height/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-2,c:`hsl(${Math.random()*360},90%,60%)`,a:Math.random()*6}));let t=0;
(function l(){x.clearRect(0,0,k.width,k.height);p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.35;q.vx*=.99;q.a+=.2;x.save();x.translate(q.x,q.y);x.rotate(q.a);x.fillStyle=q.c;x.fillRect(-4,-2,8,4);x.restore()});if(++t<180)requestAnimationFrame(l);else x.clearRect(0,0,k.width,k.height)})()}
</script></body></html>
